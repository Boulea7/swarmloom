<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fade-in entrance (capture regression)</title>
<!--
  SPDX-License-Identifier: MIT.
  Regression sample for how the HTML adapter captures CSS animations (decision C02): entrance
  animations that start at opacity 0 must be captured at their end state (visible), and infinite
  loops at half a cycle, never at the invisible first frame.
-->
<style>
  body { margin: 0; padding: 64px; background: #fafafc; color: #0b0b12; font: 18px/1.6 ui-sans-serif, system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 44px; letter-spacing: -0.02em; }
  p { max-width: 32em; color: #3d3d52; }
  .badge { display: inline-block; margin-top: 24px; padding: 6px 14px; border-radius: 999px; background: #5b5bf7; color: #fff; font-weight: 650; }
  .rise { animation: rise 900ms ease-out both; }
  .rise.late { animation-delay: 400ms; }
  .blink { animation: blink 2s linear infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <h1 id="headline" class="rise">Everything fades in</h1>
  <p id="lead" class="rise late">This text starts invisible and slides up. A capture taken at the first frame would lose it.</p>
  <span id="badge" class="badge blink">Now playing</span>
</body>
</html>
