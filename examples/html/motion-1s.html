<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello, motion. (float 1s)</title>
<!--
  SPDX-License-Identifier: MIT.
  motion.html with one edit, float 2s -> 1s (the SwarmLoom HTML/CSS episode, sl-html, take B). Self-contained:
  no scripts, no network. Laid out for a 1440x810 viewport. The code card shows this page's own .orb rule under
  this file's name, and the title names the edit, so Studio's sample wall tells the two pages apart.
-->
<style>
  :root { --ink: #0b0b12; --indigo: #5b5bf7; --coral: #ff6b5b; --teal: #14b8a6; --amber: #f5a524; --soft: #f3f3f8; --edit: #14141f; }
  html, body { margin: 0; height: 100%; }
  body { position: relative; width: 1440px; height: 810px; overflow: hidden; background: var(--soft); color: var(--ink);
    font: 16px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
  .editor { position: absolute; left: 68px; top: 113px; width: 525px; height: 585px; box-sizing: border-box; padding: 23px 27px;
    border-radius: 17px; background: var(--edit); box-shadow: 0 23px 45px rgba(11, 11, 18, .35); }
  .tab { margin: 0; color: #8a8ca0; font: 18px/1 "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace; }
  .editor pre { margin: 40px 0 0; color: #e7e7f0; font: 24px/47px "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace; white-space: pre; }
  .sel { color: #d946ef; } .prop { color: #3ba7f5; } .num { color: var(--amber); }
  .stage { position: absolute; left: 660px; top: 113px; width: 713px; height: 585px; border-radius: 21px; background: #fff;
    box-shadow: 0 23px 45px rgba(11, 11, 18, .12); }
  h1 { position: absolute; left: 53px; top: 40px; margin: 0; font-size: 69px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2;
    animation: hue 4s infinite; }
  .orb { position: absolute; left: 83px; top: 248px; width: 143px; height: 143px; border-radius: 50%; background: var(--indigo);
    animation: float 1s infinite; }
  .square { position: absolute; left: 293px; top: 270px; width: 128px; height: 128px; border-radius: 26px; background: var(--coral);
    animation: spin 4s linear infinite; }
  .pill { position: absolute; left: 480px; top: 285px; width: 165px; height: 90px; border-radius: 45px; background: var(--teal);
    animation: pulse 1s infinite; }
  .meter { position: absolute; left: 83px; top: 480px; width: 548px; height: 14px; border-radius: 7px; background: var(--soft); overflow: hidden; }
  .meter i { position: absolute; inset: 0; border-radius: 7px; background: var(--amber); transform-origin: 0 50%; animation: meter 2s infinite; }
  @keyframes float { 50% { translate: 0 -48px } }
  @keyframes hue { 50% { color: var(--indigo); } }
  @keyframes spin { to { rotate: 1turn; } }
  @keyframes pulse { 50% { scale: 1.08; } }
  @keyframes meter { from { scale: 0 1; } to { scale: 1 1; } }
</style>
</head>
<body>
  <div class="editor">
    <p class="tab">motion-1s.html</p>
<pre><span class="sel">.orb</span> {
  <span class="prop">animation</span>: float <span class="num">1s</span> infinite;
}
<span class="sel">@keyframes</span> float {
  <span class="num">50%</span> { <span class="prop">translate</span>: 0 <span class="num">-48px</span> }
}</pre>
  </div>
  <div class="stage">
    <h1>Hello, motion.</h1>
    <div class="orb"></div>
    <div class="square"></div>
    <div class="pill"></div>
    <div class="meter"><i></i></div>
  </div>
</body>
</html>
