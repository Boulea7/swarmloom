# Categories for GitHub's automatically generated release notes (not a workflow).
# A pull request is listed under the first category whose labels match. The labels are defined in
# scripts/release/labels.json; create them with `node scripts/release/sync-labels.mjs`.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Formats
      labels:
        - format
        - format-request
    - title: Platforms
      labels:
        - platform
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
