name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # VitePress lastUpdated reads git history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # base_url is the site root, e.g. https://boulea7.github.io/swarmloom (no trailing slash).
      - id: pages
        uses: actions/configure-pages@v6
      # Layout: /swarmloom/ landing site, /swarmloom/docs/, /swarmloom/studio/, /swarmloom/bm/.
      - name: Fetch website media
        run: node apps/site/scripts/fetch-media.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build website
        run: pnpm --filter @swarmloom/site build:offline
        env:
          SWARMLOOM_SITE_BASE: /swarmloom/
          SWARMLOOM_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build docs
        run: pnpm docs:build
        env:
          SWARMLOOM_DOCS_BASE: /swarmloom/docs/
      - name: Build Studio
        run: pnpm --filter @swarmloom/studio build
        env:
          SWARMLOOM_STUDIO_BASE: /swarmloom/studio/
      # The bookmarklet loads <base>/bm/swarm.js and opens <base>/studio/?from=bookmarklet when a page blocks it.
      - name: Build the bookmarklet and its install page
        run: pnpm --filter @swarmloom/bookmarklet build
        env:
          SWARMLOOM_PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/docs _site/studio _site/bm
          cp -R apps/site/dist/. _site/
          cp -R docs/.vitepress/dist/. _site/docs/
          cp -R apps/studio/dist/. _site/studio/
          cp -R apps/bookmarklet/dist/. _site/bm/
      # LICENSE.md next to the site, Studio and bookmarklet pages: SwarmLoom's licence, then the full
      # licence of every third-party package each one bundles or inlines (Phosphor icons, lottie-web ...).
      - name: Write the third-party licences of the deployed apps
        run: node scripts/release/third-party-notices.mjs --pages _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
