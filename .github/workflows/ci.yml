name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm check:lockfile
      # Same licence gate as the release pack and assets jobs (ubuntu), so a new dependency fails its PR, not the release.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check:licenses
      # Here and not in the path-filtered Extension workflow: these tests also read files outside its filter
      # (.github/workflows/pages.yml, .github/release.yml, .changeset/), so a PR touching only those runs them too.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:release
      - run: pnpm lint
      - run: pnpm typecheck
      # Build before the tests: apps/cli/test/render.test.ts drives the built render page
      # (packages/export/dist/render, not in Git) and fails under CI when it is missing.
      - run: pnpm build
      - run: pnpm test
        env:
          # The hosted runners have Chrome but no ffmpeg, so the CLI's real render tests skip here;
          # the e2e (Linux) and cli-render (Windows, macOS) jobs install ffmpeg and run them, where a missing one fails.
          SWARMLOOM_TEST_DEPS: optional
      # After the build, so the check also reads the bundlers' module paths in each dist/.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check:notices
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:bench

  e2e:
    name: browser + e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # --with-deps goes through the Ubuntu apt mirrors, whose DNS has failed for hours at a time.
      # The runner image already carries Chrome's and Firefox's shared libraries, so then install the browsers alone.
      - name: Install Chromium and Firefox
        run: |
          timeout 240 pnpm exec playwright install --with-deps chromium firefox && exit 0
          echo "::warning::apt mirrors unreachable, installing the browsers without their system packages"
          pnpm exec playwright install chromium firefox
      - run: pnpm test:browser
      # The in-browser exporter, the stage, the live page and the offline sound render in Firefox too: its foreignObject
      # rasterising, native controls, media queries, WebCodecs, scrolling and OfflineAudioContext slicing differ from
      # Chromium's. The webkit job runs them in WebKit.
      - run: pnpm test:firefox
      # Builds the --e2e Chromium package and drives it in Playwright's Chromium (apps/extension/test/e2e).
      - run: pnpm test:e2e
      # The CLI tests on a real browser and ffmpeg (apps/cli/test/render.test.ts, snapshot.test.ts, and
      # launch.test.ts's sandbox fallback): they drive the built render page, and under CI a missing browser,
      # ffmpeg or page fails them.
      - run: pnpm build
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pnpm exec vitest run --project unit apps/cli/test/render.test.ts apps/cli/test/snapshot.test.ts apps/cli/test/launch.test.ts

  # The Firefox tests again in Playwright's WebKit (Safari's engine): its foreignObject rasterising, native
  # controls, media queries, WebCodecs and scrolling differ from Chromium's and Firefox's.
  # The runner image lacks WebKit's shared libraries (GStreamer, libmanette, ...), so they come from apt here.
  # Every step must pass: a failed apt or browser download fails the job, it never turns into skipped tests.
  webkit:
    name: browser (webkit, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install WebKit's system packages
        timeout-minutes: 10
        run: pnpm exec playwright install-deps webkit
      - name: Install WebKit
        timeout-minutes: 10
        run: pnpm exec playwright install webkit
      - run: pnpm test:webkit

  # The same CLI tests on Windows and macOS, whose paths, file names and output checks differ from Linux's.
  # The runner images carry Google Chrome, which the CLI finds in its default install location; ffmpeg is installed here.
  # On Windows launch.test.ts runs only its cases that keep the sandbox: the fallback cases need a /bin/sh stand-in.
  cli-render:
    name: cli render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm build
      # Chocolatey's bin folder holds a shim that relays stdin to the real ffmpeg.exe; the real folder goes first
      # on PATH so the CLI finds and pipes its frames to ffmpeg itself.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (!$exe) { throw "no ffmpeg.exe in the Chocolatey package" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pnpm exec vitest run --project unit apps/cli/test/render.test.ts apps/cli/test/snapshot.test.ts apps/cli/test/launch.test.ts
