name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm check:lockfile
      # Same licence gate as the release pack and assets jobs (ubuntu), so a new dependency fails its PR, not the release.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check:licenses
      - run: pnpm lint
      - run: pnpm typecheck
      # Build before the tests: apps/cli/test/render.test.ts drives the built render page
      # (packages/export/dist/render, not in Git) and fails under CI when it is missing.
      - run: pnpm build
      - run: pnpm test
      # After the build, so the check also reads the bundlers' module paths in each dist/.
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check:notices
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:bench

  e2e:
    name: browser + e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # --with-deps goes through the Ubuntu apt mirrors, whose DNS has failed for hours at a time.
      # The runner image already carries Chrome's shared libraries, so then install the browser alone.
      - name: Install Chromium
        run: |
          timeout 180 pnpm exec playwright install --with-deps chromium && exit 0
          echo "::warning::apt mirrors unreachable, installing Chromium without its system packages"
          pnpm exec playwright install chromium
      - run: pnpm test:browser
      - run: pnpm test:e2e
